<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register · Crabkidz</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--orange:#F26B0F;--strong:#C74A00;--bg:#F6F3F0;--ink:#241A13;--muted:#6F6259;--line:#E0D8D1;--bad:#B3261E;--good:#1F7A4D;
--display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);min-height:100vh}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.hero{background:var(--orange);color:#1E0F03;padding:40px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;font:800 28px var(--display)}
.brand svg{width:44px;height:44px}
.hero h2{font-size:clamp(34px,4.6vw,58px);font-weight:800;line-height:1.05;max-width:11ch}
.hero p{max-width:34ch;font-weight:500;margin:14px 0 0}
.hero ol{margin:0;padding-left:20px;font-weight:600;line-height:1.9}
.panel{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.box{width:100%;max-width:400px}
.box h1{font-size:34px;font-weight:800}
.lead{color:var(--muted);margin:6px 0 24px}
.fl{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px;margin-bottom:16px}
input[type=email],input[type=password],input[type=text],select{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-weight:400}
input:focus,select:focus{border-color:var(--orange)}
input[aria-invalid=true]{border-color:var(--bad)}
.in{position:relative}.in input{padding-right:70px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--strong);font-weight:600;padding:6px 10px;cursor:pointer;border-radius:8px}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.match{font-size:14px;font-weight:600;min-height:1.4em;margin:-8px 0 12px}
.match.ok{color:var(--good)}.match.no{color:var(--bad)}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:1.4em;margin:0 0 10px}
.go{width:100%;border:0;background:var(--strong);color:#fff;font-weight:700;font-size:17px;padding:14px;border-radius:12px;cursor:pointer}
.go:hover{filter:brightness(1.1)}
.done{background:#DDF3E6;color:var(--good);border-radius:12px;padding:16px;margin-top:16px;font-weight:600}
.done p{margin:0 0 8px}
.rgtxt{background:#fff;border:1px dashed var(--muted);border-radius:8px;padding:10px;margin:10px 0;white-space:pre-wrap;font-weight:400;color:var(--ink);word-break:break-word}
.cp{border:1.5px solid var(--good);background:#fff;color:var(--good);border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
.back{text-align:center;margin:22px 0 0;font-size:15px}.back a{color:var(--strong);font-weight:600}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.hero{padding:22px 20px;min-height:0;gap:14px}.hero h2{font-size:30px;max-width:none}.hero p,.hero ol{display:none}.panel{align-items:flex-start;padding-top:28px}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="hero">
    <div class="brand"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="24" r="11" fill="#1E0F03"/><path d="M9 17C5 15 4 9 8 6c1 4 4 5 6 6M31 17c4-2 5-8 1-11-1 4-4 5-6 6" stroke="#1E0F03" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="22" r="2" fill="#F26B0F"/><circle cx="24" cy="22" r="2" fill="#F26B0F"/></svg>crabkidz</div>
    <div><h2>Join the Crabkidz team.</h2><p>Request a POS account. The store owner approves every new account before it works.</p></div>
    <ol><li>Fill in the form</li><li>Send your request</li><li>Sign in once approved</li></ol>
  </aside>
  <main class="panel">
    <div class="box">
      <h1>Create your account</h1>
      <p class="lead">Fill in your details to request access.</p>
      <div id="fm">
        <label class="fl" for="nm">Full name<input id="nm" type="text" autocomplete="name"></label>
        <label class="fl" for="em">Email<input id="em" type="email" autocomplete="email" inputmode="email" placeholder="you@crabkidz.com"></label>
        <label class="fl" for="rl">Role<select id="rl"><option>Cashier</option><option>Admin</option></select></label>
        <label class="fl" for="pw">Password
          <span class="in"><input id="pw" type="password" autocomplete="new-password"><button type="button" class="eye" id="eye" aria-label="Show passwords">Show</button></span>
          <span class="hint">At least 8 characters.</span>
        </label>
        <label class="fl" for="pw2">Re-enter password<input id="pw2" type="password" autocomplete="new-password"></label>
        <p class="match" id="mt" aria-live="polite"></p>
        <p class="err" id="err" role="alert"></p>
        <button class="go" id="go" type="button">Create account</button>
      </div>
      <div class="done" id="done" hidden role="status"></div>
      <p class="back">Already have an account? <a href="https://claude.ai/artifact/XpZDKTmiod5hE89y8JZ1JR" target="_top">Back to sign in</a></p>
    </div>
  </main>
</div>
<script>
var $=function(i){return document.getElementById(i)};
$('eye').addEventListener('click',function(){var h=$('pw').type==='password';$('pw').type=$('pw2').type=h?'text':'password';this.textContent=h?'Hide':'Show';this.setAttribute('aria-label',h?'Hide passwords':'Show passwords')});
function match(){var a=$('pw').value,b=$('pw2').value,m=$('mt');if(!b){m.textContent='';m.className='match';return}
  var ok=a===b;m.textContent=ok?'Passwords match':'Passwords do not match';m.className='match '+(ok?'ok':'no')}
$('pw').addEventListener('input',match);$('pw2').addEventListener('input',match);
function fail(m,el){$('err').textContent=m;['nm','em','pw','pw2'].forEach(function(i){$(i).removeAttribute('aria-invalid')});if(el){el.setAttribute('aria-invalid','true');el.focus()}}
function submit(){
  var n=$('nm').value.trim(),e=$('em').value.trim();
  if(!n)return fail('Enter your full name.',$('nm'));
  if(!/^\S+@\S+\.\S+$/.test(e))return fail('Enter a valid email address.',$('em'));
  if($('pw').value.length<8)return fail('Your password needs at least 8 characters.',$('pw'));
  if(!$('pw2').value)return fail('Re-enter your password to confirm it.',$('pw2'));
  if($('pw').value!==$('pw2').value)return fail('The passwords do not match.',$('pw2'));
  fail('');
  var sub='Crabkidz account registration request',body='Hi,\n\nI would like to register for a Crabkidz POS account.\n\nFull name: '+n+'\nEmail: '+e+'\nRole: '+$('rl').value+'\n\nThank you.';
  $('done').hidden=false;
  $('done').innerHTML='<p>Request ready for '+n.replace(/[&<>]/g,'')+'.</p><p style="font-weight:400">If your email app did not open, send this message to <b>o.masaraure@gmail.com</b>. Your password is not included.</p><div class="rgtxt" id="txt"></div><button type="button" class="cp" id="cp">Copy message</button>';
  $('txt').textContent='To: o.masaraure@gmail.com\nSubject: '+sub+'\n\n'+body;
  $('cp').addEventListener('click',copy);
  var a=document.createElement('a');a.href='mailto:o.masaraure@gmail.com?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);a.target='_top';document.body.appendChild(a);a.click();a.remove();
  $('pw').value=$('pw2').value='';match()}
function copy(){var t=$('txt').textContent,b=$('cp');
  function done(){b.textContent='Copied'}
  function fb(){var r=document.createRange();r.selectNodeContents($('txt'));var s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');done()}catch(y){b.textContent='Select the text and copy it'}}
  try{navigator.clipboard.writeText(t).then(done,fb)}catch(x){fb()}}
$('go').addEventListener('click',submit);
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT')submit()});
</script>
</body>
</html>
